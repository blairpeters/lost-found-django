{% extends 'master.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container">
    <form action="{% url 'post_items' %}" method ="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button class="btn btn-info">Submit</button>

    </form>
</div>
{% endblock %}
